syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

message MovinetCalculatorOptions {
  extend CalculatorOptions {
    optional MovinetCalculatorOptions ext = 451684239;
  }
  // Paths relative to the served graph's base directory, or absolute paths.
  optional string model_path = 1;
  optional string labels_path = 2;
}
