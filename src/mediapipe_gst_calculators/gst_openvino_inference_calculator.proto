syntax = "proto2";
package mediapipe;

import "mediapipe/framework/calculator.proto";

message GstOpenVinoInferenceCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional GstOpenVinoInferenceCalculatorOptions ext = 113473751;
  }

  required string model_path = 1;
  optional string input_name = 2 [default = "data"];
  optional string performance_hint = 3 [default = "LATENCY"];
  optional uint32 num_streams = 4 [default = 1];
}