services:
  ovms-llm:
    image: ${OVMS_IMAGE}
    container_name: ovms-llm
    entrypoint: []
    user: "${HOST_UID}:${HOST_GID}"
${GPU_ARGS}
    ports:
      - "127.0.0.1:${OVMS_REST_PORT}:8000"
    volumes:
      # Model cache directory - OVMS will materialize models here on --source_model pull
      - "${MODEL_CACHE_DIR}:/models:rw"
    environment:
      # Hugging Face token for gated models.
      HF_TOKEN: "${HF_TOKEN}"
      # Model configuration variables
      MODEL_ID: "${MODEL_ID}"
      LOCAL_NAME: "${LOCAL_NAME}"
      TARGET_DEVICE: "${TARGET_DEVICE}"
      # Proxy configuration (forwarded from host if set)
      http_proxy: "${http_proxy}"
      https_proxy: "${https_proxy}"
      HTTP_PROXY: "${HTTP_PROXY}"
      HTTPS_PROXY: "${HTTPS_PROXY}"
      no_proxy: "${no_proxy}"
      NO_PROXY: "${NO_PROXY}"
    command:
      - /bin/bash
      - -c
      - |
        ARGS=(
          --model_repository_path /models
          --source_model "${MODEL_ID}"
          --model_name "${LOCAL_NAME}"
          --task text_generation
          --rest_port 8000
        )
        [[ -n "${TARGET_DEVICE}" ]] && ARGS+=(--target_device "${TARGET_DEVICE}")
        exec ovms "$${ARGS[@]}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/v1/config | grep --quiet '\"AVAILABLE\"'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    networks:
      - ovms-net
    restart: unless-stopped

  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.59.0
    container_name: openhands
    depends_on:
      ovms-llm:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPENHANDS_PORT}:3000"
    extra_hosts:
      # Allows OpenHands container to reach host services if needed
      - host.docker.internal:host-gateway
    environment:
      # OVMS OpenAI-compatible endpoint
      LLM_BASE_URL: http://ovms-llm:8000/v3
      # Model identifier - must include 'openai/' prefix for OpenHands.
      LLM_MODEL: openai/${LOCAL_NAME}
      # OpenHands requires a non-empty API key even though OVMS doesn't authenticate
      LLM_API_KEY: unused
      # OVMS exposes native OpenAI-compatible tool calling. Explicit configuration avoids
      # OpenHands treating the custom model name as text-only.
      LLM_NATIVE_TOOL_CALLING: "true"
      # Generation parameters
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_OUTPUT_TOKENS: "5000"
      LLM_MAX_INPUT_TOKENS: "4096"
      LLM_TIMEOUT: "120000"
      # Use a runtime image matching the OpenHands application version.
      SANDBOX_RUNTIME_CONTAINER_IMAGE: "${OPENHANDS_RUNTIME_IMAGE}"
      # Run OpenHands and its sandboxes as the host user with bounded memory.
      SANDBOX_USER_ID: "${HOST_UID}"
      SANDBOX_DOCKER_RUNTIME_KWARGS: '{"mem_limit": "1536m", "memswap_limit": "1536m"}'
      # Proxy configuration (forwarded from host if set)
      http_proxy: "${http_proxy}"
      https_proxy: "${https_proxy}"
      HTTP_PROXY: "${HTTP_PROXY}"
      HTTPS_PROXY: "${HTTPS_PROXY}"
      no_proxy: "${OPENHANDS_NO_PROXY}"
      NO_PROXY: "${OPENHANDS_NO_PROXY_UPPER}"
    volumes:
      # Docker socket for OpenHands to create runtime sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent OpenHands settings - repo-local for transparency
      - ./.openhands:/.openhands
    networks:
      - ovms-net
    restart: unless-stopped

networks:
  ovms-net:
    name: ovms-net
    driver: bridge
